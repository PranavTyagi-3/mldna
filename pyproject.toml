[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlops"
version = "0.0.1"
description = "Internal MLOps framework combining DVC + MLflow on an Azure ML backend"
requires-python = ">=3.10"
dependencies = [
    # mlflow 3.x's register_model() calls a "Logged Models" search endpoint that
    # Azure ML's MLflow-compatible tracking server does not implement (404) —
    # verified via spikes/02_register_folder_model.py. Pin to the 2.x line, which
    # registers folder bundles the old way and works against AML today.
    "mlflow<3",
    # Unpinned pip resolved azureml-mlflow down to 1.36.0 (2022-era, incompatible
    # artifact-repo builder signature). 1.62.0.post5 is the latest available and
    # is what spikes 01-03 were verified against.
    "azureml-mlflow>=1.62",
    "azure-ai-ml",
    "azure-identity",
    "dvc[azure]",
    "typer",
    "pyyaml",
    "psutil",
    "numpy",
    # onnxruntime>=1.21 has a native-extension DLL conflict with pyarrow (an
    # mlflow dependency) on Windows: importing pyarrow before onnxruntime makes
    # onnxruntime's pybind extension fail to load ("DLL load failed while
    # importing onnxruntime_pybind11_state"). Since mlflow is always imported
    # first in this package, that's every real run. 1.20.1 doesn't hit it -
    # confirmed empirically, see DECISIONS.md D#23.
    "onnxruntime==1.20.1",
    # azureml-mlflow's plugin registration uses pkg_resources (old-style entry
    # points), which setuptools>=81 no longer bundles by default. Without this
    # pin, mlflow.set_tracking_uri("azureml://...") fails to resolve the scheme.
    "setuptools<81",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "scikit-learn",
    # Only for hand-building test ONNX models (onnx.helper/onnx.checker) -
    # skl2onnx was tried first but segfaults on import in this test suite,
    # see DECISIONS.md D#23.
    "onnx",
]

[project.scripts]
mlops = "mlops.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mlops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
