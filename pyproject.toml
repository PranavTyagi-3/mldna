[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mldna"
version = "0.1.0"
description = "A lineage layer for ML teams: DVC + MLflow glue with content-addressed model lineage, gated publishing, and lockfile-pinned model consumption"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Pranav Tyagi", email = "pranavww@gmail.com" }]
keywords = ["mlops", "mlflow", "dvc", "lineage", "model-registry", "reproducibility", "provenance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Version Control",
]
requires-python = ">=3.10"
dependencies = [
    # mlflow-skinny, not full mlflow: mldna only ever acts as an mlflow *client*
    # (local file:-store tracking, or Azure ML's own hosted server) — it never
    # runs `mlflow server` itself. Full mlflow bundles a Flask tracking server
    # plus scikit-learn/pandas/matplotlib/docker/sqlalchemy for flavors and UI
    # features mldna never touches; azureml-mlflow itself only ever requires
    # mlflow-skinny (verified via its own package metadata), so this pin doesn't
    # cost anything on the Azure path either.
    #
    # mlflow 3.x's register_model() calls a "Logged Models" search endpoint that
    # Azure ML's MLflow-compatible tracking server does not implement (404) —
    # verified via spikes/02_register_folder_model.py. Pin to the 2.x line, which
    # registers folder bundles the old way and works against AML today.
    "mlflow-skinny<3",
    # Plain dvc, NOT dvc[azure]: the base install is local-only and must carry
    # zero Azure dependencies (the README promises this). The [azure] extra
    # re-adds dvc[azure] for the blob-remote path.
    "dvc",
    "typer",
    "pyyaml",
    "psutil",
]

[project.urls]
Repository = "https://github.com/PranavTyagi-3/MLOps"
Issues = "https://github.com/PranavTyagi-3/MLOps/issues"

[project.optional-dependencies]
azure = [
    "dvc[azure]",
    # Unpinned pip resolved azureml-mlflow down to 1.36.0 (2022-era, incompatible
    # artifact-repo builder signature). 1.62.0.post5 is the latest available and
    # is what spikes 01-03 were verified against.
    "azureml-mlflow>=1.62",
    "azure-ai-ml",
    "azure-identity",
    # azureml-mlflow's plugin registration uses pkg_resources (old-style entry
    # points), which setuptools>=81 no longer bundles by default. Without this
    # pin, mlflow.set_tracking_uri("azureml://...") fails to resolve the scheme.
    # Only azureml-mlflow needs this — local-only installs don't touch that
    # code path at all.
    "setuptools<81",
]
dev = [
    "pytest",
    "pytest-xdist",
]

[project.scripts]
mldna = "mldna.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mldna"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"
